name: Build AI Salon Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o AI_Salon_Manager_Phone_Build.zip -d source
          ls -la source/ai_salon

      - name: Build Android APK
        working-directory: source/ai_salon
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Salon-Manager-APK
          path: source/ai_salon/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
